# CI do agente. O Render só publica quando estes checks passam (render.yaml: autoDeployTrigger: checksPass).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions por SHA de commit (tag de action é móvel: quem controla o repositório dela muda o código sob a mesma tag).
# O comentário diz a versão; o Dependabot atualiza os dois juntos.
permissions:
  contents: read

jobs:
  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: testes do agente (sem tokens; o teste com modelo real fica pulado)
        run: |
          uv sync --frozen --extra dev
          .venv/bin/pytest -q
      - name: lint
        run: .venv/bin/ruff check src tests

  imagem:
    # Garante que o Dockerfile que o Render usa continua compilando.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t canteiro-agente .
      - name: o contêiner sobe e responde /saude
        run: |
          docker run -d --name agente -p 8100:8100 -e MODELO_ROTEIRO=1 canteiro-agente
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8100/saude && exit 0; sleep 1; done
          docker logs agente; exit 1
